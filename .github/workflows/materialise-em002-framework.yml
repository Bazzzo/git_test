name: Materialise EM-002 framework

on:
  push:
    branches:
      - em-002-clean-room-pilot-v2

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: em-002-clean-room-pilot-v2
          fetch-depth: 0

      - name: Download verified clean-room evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-9210-820a-9803-3ebac6dd5727/raw?se=2026-07-26T08:40:49Z&sp=r&sv=2026-02-06&sr=b&scid=3ea37d9d-8109-50ed-ad81-ab472bfc2792&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-26T05:31:04Z&ske=2026-07-28T05:31:04Z&sks=b&skv=2026-02-06&sig=fVtf2pNpphiIbo4g5lrweBPECK7axTJ0ZfxkdOEBEJw%3D' \
            --output /tmp/em002-evidence.zip
          mkdir -p /tmp/em002-evidence
          unzip -q /tmp/em002-evidence.zip -d /tmp/em002-evidence
          test -f /tmp/em002-evidence/clean-room-pilot-installed.tar.gz

      - name: Materialise exact installed snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/em002-evidence/clean-room-pilot-installed.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/materialise-em002-framework.yml
          test -f .github/copilot-instructions.md
          test -f .ai-engineering/manifest.json
          test -f .ai-engineering/project-context.md
          test -n "$(find .github/agents -name '*.agent.md' -print -quit)"

      - name: Commit persisted framework handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Persist verified AI Engineering Team installation'
          git push origin HEAD:em-002-clean-room-pilot-v2
